# The HarnessWeaver docs site (ADR-0041). Build it with `make docs` (strict: a broken
# link, anchor or page left out of the navigation fails the build) or browse it with
# `make docs-serve`.
site_name: HarnessWeaver
site_description: >-
  The composable AI harness framework. Weave your own AI harness: bring your models,
  choose your plugins, define your execution.
repo_url: https://github.com/Wise-DreamerZ/HarnessWeaver
repo_name: Wise-DreamerZ/HarnessWeaver
edit_uri: edit/main/docs/
copyright: HarnessWeaver is licensed under Apache-2.0.

docs_dir: docs
# The design guide is the source document and is never edited (RULES D4); the site
# links to it on GitHub instead of rendering it.
exclude_docs: |
  AI Harness Framework Design and Build Guide.*
  /assets/roadmap.png
  .claude/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  font:
    text: Inter
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  # The brand theme: dark by default, with a light scheme behind the toggle. The
  # colors, headings and shapes are in docs/stylesheets/brand.css.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

extra_css:
  - stylesheets/brand.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # QUICKSTART.md, CONTRIBUTING.md, SECURITY.md and CHANGELOG.md have one source each,
  # at the repository root, included here.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

