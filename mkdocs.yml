# The HarnessWeaver docs site (ADR-0041). Build it with `make docs` (strict: a broken
# link, anchor or page left out of the navigation fails the build) or browse it with
# `make docs-serve`.
site_name: HarnessWeaver
site_description: >-
  The composable AI harness framework. Weave your own AI harness: bring your models,
  choose your plugins, define your execution.
repo_url: https://github.com/Wise-DreamerZ/HarnessWeaver
repo_name: Wise-DreamerZ/HarnessWeaver
edit_uri: edit/main/docs/
copyright: HarnessWeaver is licensed under Apache-2.0.

docs_dir: docs
# The design guide is the source document and is never edited (RULES D4); the site
# links to it on GitHub instead of rendering it.
exclude_docs: |
  AI Harness Framework Design and Build Guide.*
  /assets/roadmap.png
  .claude/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  font:
    text: Inter
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  # The brand theme: dark by default, with a light scheme behind the toggle. The
  # colors, headings and shapes are in docs/stylesheets/brand.css.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

extra_css:
  - stylesheets/brand.css
  - stylesheets/termynal.css

# `console` code blocks play as typed terminal sessions (ADR-0042): termynal is
# vendored with its license, and terminals.js turns each block into one.
extra_javascript:
  - javascripts/termynal.js
  - javascripts/terminals.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Wise-DreamerZ/HarnessWeaver
      name: HarnessWeaver on GitHub

# Docstrings cross-reference with Sphinx roles; this hook shows them as code spans.
hooks:
  - scripts/docs_hooks.py

# The Python API reference is generated from the docstrings (ADR-0042). Griffe reads
# the source statically, so building the docs imports no HarnessWeaver code.
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python/harnessweaver/src]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_bases: true
            members_order: source
            filters: ["!^_"]
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      # Marks each block with its language, so terminals.js finds the `console` ones.
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # QUICKSTART.md, CONTRIBUTING.md, SECURITY.md and the changelogs have one source each,
  # at the repository root or in their package, included here.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

