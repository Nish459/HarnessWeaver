# The offline overlay: HARNESSWEAVER_ENV=offline swaps the gateway for a scripted
# model (R14). Each rule answers one question, matched on the prompt's question line,
# citing the article the retrieval finds for it.
models:
  provider: scripted
  rules:
    - contains: "Question: How long does a refund"
      reply: { text: "A refund goes back to the card you paid with within five business days [help-refunds]." }
    - contains: "Question: The dashboard is down"
      reply: { text: "Check status.acme.example for the current incident [help-status]. Your contract promises a reply within four hours [help-globex-sla]." }
    - contains: "Question: How do I export"
      reply: { text: "Open Reports, pick the report and choose Export as CSV [help-export]." }
  replies:
    - text: "I don't know."
