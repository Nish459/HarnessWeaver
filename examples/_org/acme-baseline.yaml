# Acme's org baseline: the controls every Acme app gets and no app can switch off.
#
# Apps pick it up with `extends: ["org://acme-baseline@^1"]` and find it through
# HARNESSWEAVER_PROFILE_PATH (or --profile-dir), which points at this directory.
# Platform security owns this file; tightening it is a major version (V3).
apiVersion: harnessweaver/v1
kind: Profile
metadata: { name: acme-baseline, version: 1.0.0, owner: platform-security }

# Only plugins the platform team has reviewed (S8).
plugins:
  allow: [openai, anthropic, otel]

# Internal tools guard their inputs and outputs; riskier apps go further.
require_level:
  default: L1
  tiers: { customer_facing: L2, takes_actions: L3 }

observability:
  capture_content: false            # R9

models:
  allowed_aliases: [fast, strong]   # the aliases the gateway serves

guardrails:
  input:
    - { id: base-pii, use: pii.regex, action: redact }
  output:
    - { id: base-secrets, use: secrets.scan, action: block }

tools:
  require_manifest: true            # S2

budgets:
  per_run: { max_usd: 2.00, deadline: 5m }

locks:
  - plugins.allow
  - observability.capture_content
  - guardrails.input[base-pii]
  - guardrails.output[base-secrets]
  - tools.require_manifest

# R10: a value outside these fails loading; nothing is clamped.
bounds:
  budgets.per_run.max_usd: { max: 5.00 }
  budgets.per_run.deadline: { max: 30m }
  tasks.*.budget.max_usd: { max: 2.00 }
