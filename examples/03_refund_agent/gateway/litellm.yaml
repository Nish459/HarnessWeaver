# LiteLLM Proxy config for refund-agent, generated by
# `harnessweaver gateway litellm` from the spec and its tool manifests (ADR-0039).
# Regenerate it when they change. In the gateway's environment (S1), set
# LITELLM_MASTER_KEY, the provider keys, and the provider model behind each name:
#   HARNESSWEAVER_UPSTREAM_FAST_CHAT
#   HARNESSWEAVER_UPSTREAM_STRONG_CHAT
# Policy rules, budgets, guards and approvals stay with the harness.
# Tools only the harness runs (denied here; run them through harnessd):
#   email_customer: it has egress, and the trifecta check needs what the run has seen (S3)
#   refund_payment: it can need a person's approval, which only the harness can wait for
model_list:
- model_name: fast-chat
  litellm_params:
    model: os.environ/HARNESSWEAVER_UPSTREAM_FAST_CHAT
- model_name: strong-chat
  litellm_params:
    model: os.environ/HARNESSWEAVER_UPSTREAM_STRONG_CHAT
router_settings:
  num_retries: 2
  model_group_alias:
    fast: fast-chat
    strong: strong-chat
  timeout: 300
litellm_settings:
  turn_off_message_logging: true
guardrails:
- guardrail_name: harnessweaver-tools
  litellm_params:
    guardrail: tool_permission
    mode: post_call
    default_on: true
    rules:
    - id: allow-lookup_order
      tool_name: ^lookup_order$
      decision: allow
      allowed_param_patterns:
        order_id: ^A-[0-9]{4}$
    - id: withhold-email_customer
      tool_name: ^email_customer$
      decision: deny
    - id: withhold-refund_payment
      tool_name: ^refund_payment$
      decision: deny
    default_action: deny
    on_disallowed_action: block
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
