# Tool allow-list for refund-agent, generated by
# `harnessweaver gateway mcp` (ADR-0039; schema tool-allow-list). An MCP gateway
# allows these tools only, pins each digest, and requires its scopes.
apiVersion: harnessweaver/v1
kind: ToolAllowList
metadata:
  name: refund-agent
default: deny
tools:
- tool: lookup_order
  transport: native
  server: null
  digest: sha256:a860f0a0ecfad3cc9c52ee9e5813e12d2532dec299b7f9faff326a45ba25c267
  scopes: []
withheld:
- tool: email_customer
  reason: it has egress, and the trifecta check needs what the run has seen (S3)
- tool: refund_payment
  reason: it can need a person's approval, which only the harness can wait for
