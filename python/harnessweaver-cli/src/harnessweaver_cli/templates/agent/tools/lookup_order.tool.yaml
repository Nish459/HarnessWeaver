# lookup_order: reads an order. Low risk, no approval.
apiVersion: harnessweaver/v1
kind: Tool
metadata: { name: lookup_order, version: 1.0.0, owner: your-team }
spec:
  transport: native
  handler: "app.tools:lookup_order"
  description: Look up an order by its id.
  input_schema:
    type: object
    properties:
      order_id: { type: string, description: "The order's id, such as A-1001." }
    required: [order_id]
  side_effect: read
  risk: low
