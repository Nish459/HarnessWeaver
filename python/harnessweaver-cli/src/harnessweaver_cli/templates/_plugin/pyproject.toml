[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "__dist__"
version = "0.1.0"
description = "A HarnessWeaver plugin: guards and other contributions under the __ns__ namespace."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["harnessweaver>=0.1.0"]

# The one registration a plugin needs: its namespace, and where its hw.Plugin is (DESIGNS No. 13).
[project.entry-points."harnessweaver.plugins"]
__ns__ = "__ns___harness:plugin"

[dependency-groups]
dev = ["pytest>=9"]

[tool.hatch.build.targets.wheel]
packages = ["src/__ns___harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every run also runs the HarnessWeaver conformance suite on this plugin (RULES T5).
addopts = ["--import-mode=importlib", "--harnessweaver-conformance=__ns__"]
