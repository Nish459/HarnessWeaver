# The dev stack's OpenTelemetry collector, written by `harnessweaver dev`: OTLP in from
# the app, harnessd and LiteLLM, traces out to the local Langfuse (OTLP over HTTP;
# Langfuse doesn't take gRPC). LANGFUSE_OTLP_AUTH comes from .env.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch: {}

exporters:
  otlp_http/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      Authorization: "Basic ${env:LANGFUSE_OTLP_AUTH}"
      x-langfuse-ingestion-version: "4"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/langfuse]
